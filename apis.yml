name: Bonum Coaching
description: Bonum Coaching is an enterprise coaching platform based in Latin America
  that pairs personalized human coaching with technology to develop talent and improve
  organizational performance. Its offering spans one-to-one executive coaching, group
  and team coaching, structured mentoring programs, and CLARA, an AI coach-bot for
  practicing workplace conversations in a safe environment. The company positions
  itself around democratizing access to coaching, leadership development, talent retention,
  building a growth culture, and diversity, equity and inclusion, and counts enterprises
  such as Uber, Davivienda, Farmatodo, and Mi Banco among its clients. Backed by 500
  Global, Bonum Coaching is tracked in the API Evangelist network as a company profile.
